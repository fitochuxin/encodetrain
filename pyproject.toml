[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitochuxin-encodetrain"
version = "0.1.0"
description = "解析时间标记，排列训练数据的编码探测的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fitochuxin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fitochuxin.github.io"
Repository = "https://github.com/fitochuxin/encodetrain"
Issues = "https://github.com/fitochuxin/encodetrain/issues"

[project.scripts]
encodetrain = "encodetrain:main"

[tool.setuptools]
py-modules = ["encodetrain"]
